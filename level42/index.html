<body>
  <!-- 5) სრული ვებ-საიტი, რომელიც აერთიანებს Box Layout-ს, Flexbox-სა და Positioning-ს -->
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>დონე 42 - ვებ-საიტი</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            color: #333;
            position: relative;
            min-height: 100vh;
        }

        /* ნავიგაციის პანელი (Flexbox გამოყენებით) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            padding: 20px 40px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        /* მთავარი კონტენტი (Box Model & Flexbox) */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 50px;
        }

        .card {
            width: 250px;
            padding: 20px;
            background-color: white;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
        }

        /* Relative პოზიციონირების მაგალითი ბარათზე */
        .card-relative {
            position: relative;
            top: 20px;
        }

        /* Absolute პოზიციონირების ელემენტი კუთხეში */
        .floating-badge {
            position: absolute;
            top: 100px;
            right: 40px;
            background-color: #27ae60;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2>ჩემი საიტი</h2>
        <div class="nav-links">
            <a href="#">მთავარი</a>
            <a href="#">შესახებ</a>
            <a href="#">კონტაქტები</a>
        </div>
    </header>

    <div class="floating-badge">Absolute ბეჯი</div>

    <div class="main-content">
        <div class="card">
            <h3>ჩვეულებრივი ბარათი</h3>
            <p>ეს არის სტანდარტული ყუთი Box Model-ით.</p>
        </div>
        <div class="card card-relative">
            <h3>Relative ბარათი</h3>
            <p>ეს ბარათი გადაადგილებულია თავისი საწყისი ადგილიდან.</p>
        </div>
    </div>

</body>
</html>
  
</body>
</html>
