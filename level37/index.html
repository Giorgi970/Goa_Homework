<body>
  <!-- 
 პროგრამირებაში  Box Layout (იგივე CSS Box Model — ყუთების მოდელი) 
არის ფუნდამენტური კონცეფცია, რომელიც განსაზღვrავს, თუ როგორ ნაწილდება, ზომავდა და ექცევა 
ერთმანეთთან HTML ელემენტები ვებგვერდზე. თითოეული HTML ელემენტი წარმოადგენს მართკუთხა ყუთს, 
რომელიც შედგება 4 ძირითადი შრისგან.
შიგნიდან გარეთ ეს შრეები ასე გამოიყურება:

1. Content (შინაარსი)
    ეს არის ყუთის შიდა, ცენტრალური ნაწილი, სადაც რეალური კონტენტი — ტექსტი, სურათები, 
     ვიდეოები ან სხვა HTML ელემენტები თავსდება.
   - განმარტება: მისი ზომების (სიგანისა და სიმაღლის) მართვა შესაძლებელია CSS-ის width და height თვისებებით.

2. Padding (შიდა ველი / შუალედი)
    სივრცე შიგთავსსა (Content) და საზღვარს (Border) შორის.
   - განმარტება: ის ემსახურება ტექსტის ან სურათის „ჩამოშორებას“ ყუთის კიდეებიდან შიგნით მხარეს. 
     Padding-ის ფონური ფერი ემთხვევა თავად ელემენტის ფონს.

3. Border (ჩარჩო / საზღვარი)
    ხაზი, რომელიც გარს აკრავს შიგთავსსა (Content) და შიდა ველს (Padding).
   - განმარტება: შესაძლებელია მისი სისქის (border-width), სტილის (border-style) და ფერის (border-color) მართვა.

4. Margin (გარე ველი / განაპირა სივრცე)
    ყველაზე გარე შრე, რომელიც ყუთს აშორებს მიმდებარე (სხვა) ელემენტებისგან.
    Margin არის სრულიად გამჭვირვალე სივრცე. მისი მთავარი დანიშნულებაა 
     ელემენტებს შორის დისტანციის დაჭერა, რათა ისინი ერთმანეთს არ მიეკრან.
-->

</body>
</html>
