<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <style>
  
  .roman-list {
    list-style-type: upper-roman;
    padding-left: 30px;
  }
  
  .roman-list li {
    margin-bottom: 10px;
    padding-left: 10px; 
    text-indent: -10px; 
  }

  .icon-list {
    list-style: none; 
    padding-left: 0;
  }

  .icon-list li {
    position: relative;
    padding-left: 25px;
    margin-bottom: 8px;
  }

 
  .icon-list li::before {
    content: "❯"; 
    position: absolute;
    left: 0;
    color: #4a90e2;
    font-weight: bold;
  }

  .custom-form {
    max-width: 400px;
    background: #f9f9f9;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    font-family: sans-serif;
    margin-top: 20px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
  }

  .form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }

  .form-group input:focus {
    border-color: #4a90e2;
    outline: none;
  }

  .submit-btn {
    background: #4a90e2;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
  }

  .submit-btn:hover {
    background: #357abd;
  }
</style>


<ol class="roman-list">
  <li>ეს არის პირველი ელემენტი, რომელიც იყენებს რომაულ ციფრებს და ტექსტი გრძელდება შემდეგ ხაზზე, რომელიც შიგნიდან იწყება.</li>
  <li>კიდევ ერთი ელემენტი ტესტირებისთვის, რომ უკეთ გამოჩნდეს ეფექტი.</li>
</ol>


<ul class="icon-list">
  <li>პირველი ელემენტი მორგებული იკონით.</li>
  <li>მეორე ელემენტი მორგებული იკონით.</li>
</ul>


<form class="custom-form">
  <div class="form-group">
    <label for="username">სახელი:</label>
    <input type="text" id="username" placeholder="შეიყვანეთ სახელი">
  </div>
  <div class="form-group">
    <label for="email">ელ-ფოსტა:</label>
    <input type="email" id="email" placeholder="შეიყვანეთ ელ-ფოსტა">
  </div>
  <button type="submit" class="submit-btn">გაგზავნა</button>
  


 
</body>
</html>
